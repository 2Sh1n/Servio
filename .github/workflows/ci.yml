name: Servio CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  serviopanel:
    name: Check Servio Panel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/serviopanel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: intl, mbstring, json, mysqlnd, curl, gd, zip
          coverage: none

      - name: Check PHP syntax
        run: |
          find app -name "*.php" -print0 | xargs -0 -n1 php -l

  servio-web:
    name: Check Servio Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/servio-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint if available
        run: npm run lint --if-present

  servio-customer-app:
    name: Check Customer Flutter App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/servio-customer-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

  servio-provider-app:
    name: Check Provider Flutter App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/servio-provider-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze